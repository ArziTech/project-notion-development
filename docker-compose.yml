# ============================================
# Docker Compose for Development
# ============================================
version: '3.9'

services:
  # ============================================
  # Next.js Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: nextjs-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_ENV=development
      - NEXT_PUBLIC_APP_NAME=Arzi StarterKit (Dev)
      - DATABASE_URL=postgresql://arzi:arzi_password@postgres:5432/arzi_dev?schema=public
      - DATABASE_URL_DIRECT=postgresql://arzi:arzi_password@postgres:5432/arzi_dev?schema=public
      - AUTH_SECRET=dev-secret-change-in-production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arzi-network
    restart: unless-stopped

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: arzi-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=arzi
      - POSTGRES_PASSWORD=arzi_password
      - POSTGRES_DB=arzi_dev
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./prisma/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arzi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arzi -d arzi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis for caching and sessions
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: arzi-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis-dev-data:/data
    networks:
      - arzi-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # pgAdmin for database management
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arzi-pgadmin-dev
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@arzi.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin-dev-data:/var/lib/pgadmin
    networks:
      - arzi-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - tools

  # ============================================
  # Redis Commander for Redis management
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: arzi-redis-commander-dev
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis_password
    networks:
      - arzi-network
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  pgadmin-dev-data:
    driver: local

networks:
  arzi-network:
    driver: bridge

