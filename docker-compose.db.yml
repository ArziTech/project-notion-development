services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: arzi-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=arzi
      - POSTGRES_PASSWORD=arzi_password
      - POSTGRES_DB=arzi_dev
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./prisma/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arzi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arzi -d arzi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    # restart: unless-stopped

volumes:
  postgres-dev-data:
    driver: local
networks:
  arzi-network:
    driver: bridge
